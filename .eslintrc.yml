env:
  browser: true
  es2021: true
  node: true
extends:
  - google
  - prettier
parser: '@typescript-eslint/parser'
parserOptions:
  ecmaVersion: 2021
  sourceType: module
plugins:
  - '@typescript-eslint'
  - 'prettier'
rules: {
  prettier/prettier: warn,
  require-jsdoc: "off"
}
ignorePatterns: ['node_modules/**', 'dist/**', 'src/Generated/**']
