publish-client:
  stage: publish
  extends:
    - .use-service-image
  needs:
    - job: build-client
      artifacts: true
    - job: test-client
      artifacts: false
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: 'clone'
    GITLAB_REPOSITORY_URL: 'https://ci:${GITLAB_TOKEN_REPOSITORY_WRITE}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git'
  before_script:
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
    - ls -al
    - env
    - git tag -l
  script:
    - git checkout ${CI_COMMIT_BRANCH}
    - git status
    - '## Initialise the dotenv report consumed by verify-npmjs-publish (overwritten once a version is tagged)'
    - echo "PUBLISHED_VERSION=none" > publish.env
    - '## Check for changes'
    - |
      # find last annotated tag matching the current branch
      set +e
      lastTag=$(git describe --abbrev=0 --match "${CI_COMMIT_BRANCH}.*")
      lastExitCode=$?
      set -e
      if [ $lastExitCode -ne 0 ]; then
        # found no matching tag
      
        echo "No ${CIRCLE_BRANCH}.* tag was found. Running workflow for .0 initial release."
      
        # find publish branches pointing to HEAD (except origin/HEAD and the current branch) to prevent publishing the same client to multiple versions
        set +e
        pointingBranches=$(git branch -r --format "%(refname:short)" --points-at HEAD | grep -vxF 'origin/HEAD' | grep -vxF "origin/${CI_COMMIT_BRANCH}" | grep -E '^origin/v[0-9]+\.[0-9]+$')
        lastExitCode=$?
        set -e
        if [ $lastExitCode -ne 1 ]; then
          echo "Publishing aborted because the following branches point to HEAD:"
          echo $pointingBranches
          exit 1
        fi
      
        # check if the last commit has [publish] in the commit message
        set +e
        git log -1 --format=%s | grep -qF '[publish]'
        lastExitCode=$?
        set -e
        if [ $lastExitCode -ne 0 ]; then
          echo "[publish] not found in the last commit message -> skipping publishing."
          # stop further execution of this job
          exit 0
        fi
      else
        # check if $lastTag points to HEAD, to prevent publishing the same version again
        set +e
        git tag --points-at HEAD | grep -qF $lastTag
        lastExitCode=$?
        set -e
        if [ $lastExitCode -eq 0 ]; then
          echo "tags/${lastTag} already points to HEAD -> skipping publishing."
          # stop further execution of this job
          exit 0
        fi
      
        # check if any commits starting with the last tag have [publish] in their commit message  
        set +e
        git log tags/${lastTag}.. --format=%s | grep -qF '[publish]'
        lastExitCode=$?
        set -e
        if [ $lastExitCode -ne 0 ]; then
          echo "No changes marked with [publish] between tags/${lastTag} and HEAD -> skipping publishing."
          # stop further execution of this job
          exit 0
        fi
      fi
    - '## Bump git tag to next minor and push new tag'
    - git config user.email ${GIT_USER_EMAIL}
    - git config user.name ${GIT_USER_NAME}
    - |
      lastTag=$(git describe --abbrev=0 --match "${CI_COMMIT_BRANCH}.*" || true)
      if [ -z $lastTag ]; then
        echo "No previous version"
        nextTag=$(echo "${CI_COMMIT_BRANCH}.0")
      else
        echo "Previous version: ${lastTag}"
        nextTag=$(echo $lastTag | awk -F. '{OFS="."; $NF+=1; print $0}')
      fi
    - echo "Publishing with tag ${nextTag}"
    - git tag -a ${nextTag} -m "Autogenerated client update ${nextTag}"
    - npm version from-git -m "Bumped package version to %s" --allow-same-version
    - git push -o ci.skip ${GITLAB_REPOSITORY_URL}
    - git push ${GITLAB_REPOSITORY_URL} tags/${nextTag}
    - '## Publishing to npmjs.com is done by GitHub Actions (.github/workflows/publish.yml) once mirror-to-github has pushed the tag'
    - |
      echo "PUBLISHED_VERSION=${nextTag#v}" > publish.env
      echo "Tagged ${nextTag}. The package is published to npmjs.com by https://github.com/datenkraft/${CI_PROJECT_NAME}/actions after mirroring."
  artifacts:
    reports:
      dotenv: publish.env

mirror-to-github:
  extends:
    - .mirror-to-github
  needs:
    - job: publish-client
      artifacts: false

verify-npmjs-publish:
  stage: publish
  extends:
    - .use-service-image
  needs:
    - job: publish-client
      artifacts: true
    - job: mirror-to-github
      artifacts: false
  timeout: 20m
  script:
    - |
      if [ "${PUBLISHED_VERSION:-none}" = "none" ]; then
        echo "No version was tagged in this pipeline -> nothing to verify."
        exit 0
      fi
    - packageName=$(node -p "require('./package.json').name")
    - '## Wait until GitHub Actions (publish.yml) has published the version to npmjs.com'
    - |
      for attempt in $(seq 1 60); do
        publishedVersion=$(npm view "${packageName}@${PUBLISHED_VERSION}" version 2>/dev/null || true)
        if [ -n "${publishedVersion}" ]; then
          echo "${packageName}@${PUBLISHED_VERSION} is available on npmjs.com."
          exit 0
        fi
        echo "Attempt ${attempt}/60: ${packageName}@${PUBLISHED_VERSION} is not yet available on npmjs.com -> retrying in 15s."
        sleep 15
      done
      echo "${packageName}@${PUBLISHED_VERSION} did not show up on npmjs.com within 15 minutes."
      echo "Check the workflow run at https://github.com/datenkraft/${CI_PROJECT_NAME}/actions"
      exit 1
