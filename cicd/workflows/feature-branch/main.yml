include:
  - local: cicd/workflows/feature-branch/jobs/*.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never
      - if: $CI_COMMIT_BRANCH
            && $CI_COMMIT_BRANCH !~ '/^v[0-9]+\.[0-9]+(_deprecated|_abandoned)?$/'
            && $CI_COMMIT_BRANCH != "trigger"
            && ($run_workflow == null || $run_workflow == "")
