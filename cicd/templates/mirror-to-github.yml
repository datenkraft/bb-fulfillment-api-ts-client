.mirror-to-github:
  stage: publish
  extends:
    - .use-service-image
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: 'clone'
    MIRROR_BRANCH_PATTERN: 'v[0-9]+\.[0-9]+(_deprecated|_abandoned)?'
  before_script:
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
    - ls -al
    - env
    - git tag -l
    - git for-each-ref --format '%(refname)' refs/remotes/origin
  script:
    - echo "Mirroring to https://github.com/datenkraft/${CI_PROJECT_NAME}"
    - '## Check requirements'
    - if [ -z "${GITHUB_SSH_PRIVATE_KEY}" ]; then echo 'Could not find GITHUB_SSH_PRIVATE_KEY needed for mirroring -> aborting.'; exit 1; fi
    - '## Setup GitHub SSH access for git'
    - mkdir -p ~/.ssh
    - touch ~/.ssh/known_hosts
    - cat ${GITHUB_SSH_KNOWN_HOSTS} >> ~/.ssh/known_hosts
    - echo ${GITHUB_SSH_PRIVATE_KEY} | base64 -d > ~/.ssh/github_private_key
    - chmod 400 ~/.ssh/github_private_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/github_private_key
    - git remote add github git@github.com:datenkraft/${CI_PROJECT_NAME}.git
    - git fetch github
    - git for-each-ref --format '%(refname)' refs/remotes/github
    - '## Mirror any relevant branches to GitHub (before the tags: GitHub registers workflows from the default branch, so it has to exist before a tag can trigger .github/workflows/publish.yml)'
    - (git for-each-ref --format '%(refname):refs/heads/%(refname:lstrip=3)' refs/remotes/origin | grep -E "^refs/remotes/origin/(${MIRROR_BRANCH_PATTERN}):" || true) | xargs -r git push github
    - '## Mirror deleted branches to GitHub'
    - (git for-each-ref --format '%(refname:lstrip=3)' refs/remotes/github | grep -vF "HEAD" | grep -vFx -f <(git for-each-ref --format '%(refname:lstrip=3)' refs/remotes/origin | grep -E "^(${MIRROR_BRANCH_PATTERN})$") || true) | xargs -r git push github --delete
    - '## Mirror the repository tags to Github'
    - git push github --tags
